[project]
name = "deutsch-trainer"
version = "0.1.0"
description = "Personal Momente A2.1 trainer: comprehensible reading, FSRS vocab, grammar drills, writing feedback."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fsrs>=6.3.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
