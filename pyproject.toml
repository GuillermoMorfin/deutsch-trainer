[project]
name = "deutsch-trainer"
version = "0.1.0"
description = "Personal Momente A2.1 trainer: comprehensible reading, FSRS vocab, grammar drills, writing feedback."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.12.0",
    "de-core-news-md",
    "fastapi>=0.115",
    "fsrs>=6.3.3",
    "python-dotenv>=1.2.4",
    "spacy>=3.8.18",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
de-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl" }
